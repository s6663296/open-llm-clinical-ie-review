<section id="why-open" class="alt">
<p class="eyebrow">背景</p>
<h2>為什麼特別關注開源（開放權重）模型</h2>
<div class="grid3">
<div class="card"><h3>隱私</h3><p class="body">病歷不必送到外部 API，可以在院內伺服器執行</p></div>
<div class="card"><h3>成本與可控</h3><p class="body">不受 API 計價與模型版本更替影響</p></div>
<div class="card"><h3>可微調、可重現</h3><p class="body">能用院內資料做 LoRA 等微調，權重固定可重現結果</p></div>
</div>
<p class="lead">本回顧的「開源」= 權重可公開下載，不要求 OSI 開放授權；參數量 ≥ 1B。</p>
<aside>開源定義是 2026-11-13 的決策：權重可下載即可（Llama、Gemma 等）。參數量門檻 ≥ 1B 是為了排除 BERT 類模型。</aside>
</section>
