<h2>對臨床與研究實務的意義</h2>
<div class="grid2">
<div class="card"><h3>醫院端</h3><p class="body">資料不能離院時，開源模型在一半的研究中已追平閉源；以院內標註資料微調小型模型，是值得先試的做法。</p></div>
<div class="card"><h3>研究端</h3><p class="body">應報告部署方式（38 篇中 13 篇未報告），並在同一測試集上同時評估開源與閉源模型、統一指標。</p></div>
</div>
<aside>醫院端的建議依據 RQ3 研究層級 18 比 18 與微調組差距中位數 0.012；屬於觀察性證據，不是因果結論。研究端依據 deploy 頁的未報告比例，以及多篇研究因只有圖、補充資料或不同測試集而無法配對。</aside>
