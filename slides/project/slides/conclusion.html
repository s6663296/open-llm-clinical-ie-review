<section id="conclusion" class="dark statement" data-transition="fade">
<p class="eyebrow">結論</p>
<h2>在臨床資訊抽取上，部分研究的開源 LLM 追平或優於閉源模型</h2>
<p class="lead">微調後差距最小；但閉源在多數任務仍小幅領先，且研究間指標與資料差異大，需要更多同條件比較。</p>
<aside>結論依據：32 篇研究層級比較：開源追平或較好 14 篇、閉源領先 18 篇；83 組任務比較中位數差距 0.045、微調組 0.016。</aside>
</section>
