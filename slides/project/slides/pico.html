<p class="eyebrow">方法 · 納入條件</p>
<h2>PICO 與納入、排除條件</h2>
<div class="grid2">
<div class="card"><h3>納入</h3><p class="body">P 臨床自由文本（病歷、出院摘要、影像與病理報告）<br>I 至少一個開源 LLM（≥ 1B）<br>O 資訊抽取任務，且有量化評估（F1 等）<br>2022–2026，英文論文；病歷語言不限</p></div>
<div class="card"><h3>排除</h3><p class="body">只用閉源模型；只用合成病歷<br>非抽取任務：摘要、問答、ICD 自動編碼、文件層級分類或預測<br>無量化評估；回顧、社論；無全文</p></div>
</div>
<p class="lead"><b>課堂版收緊條件</b>：另限 <span class="open-t">同儕審查</span> 且 <span class="closed-t">同一研究內與閉源 LLM 直接比較</span>（見後頁）。</p>
<aside>排除代碼 X1–X8 見 protocol 3.2。收緊條件是事後決定，要在限制中說明。</aside>
</section>
